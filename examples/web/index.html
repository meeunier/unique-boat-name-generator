<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boat names & usernames</title>
    <meta name="description" content="Generate funny boat names and usernames based on fictional or legendary mariners.">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Boat names & usernames</h1>
          <p>Funny boat names and fictional or legendary mariners for your app.</p>
        </div>
        <a class="github" href="https://github.com/meeunier/unique-boat-name-generator" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.9a5.4 5.4 0 0 0-1.5-3.8 5 5 0 0 0-.1-3.8S17.5.7 14.8 2.4a13 13 0 0 0-7 0C5.1.7 3.9 1 3.9 1a5 5 0 0 0-.1 3.8 5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.2 6.6 6.2 6.9a3.4 3.4 0 0 0-.9 2.6V22"/></svg>
          GitHub
        </a>
      </header>
      <div class="generators">
        <section aria-labelledby="boats-title">
          <h2 id="boats-title">Boat names</h2>
          <p class="context">For a new boat.</p>
          <button id="generate-boat" type="button">Generate boat name</button>
          <p class="error" id="boat-error" role="alert"></p>
          <ul id="boat-names" aria-label="Generated boat names" aria-live="polite" aria-relevant="additions"></ul>
        </section>
        <section aria-labelledby="users-title">
          <h2 id="users-title">Usernames</h2>
          <p class="context">Each username ends in four random digits.</p>
          <button id="generate-user" type="button">Generate username</button>
          <p class="error" id="user-error" role="alert"></p>
          <ul id="user-names" aria-label="Generated usernames" aria-live="polite" aria-relevant="additions"></ul>
        </section>
      </div>
      <footer>
        <span id="counts"></span>
        <span>Names are generated in your browser. <a href="https://github.com/meeunier/unique-boat-name-generator/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT licensed.</a></span>
      </footer>
    </main>
  </body>
</html>
